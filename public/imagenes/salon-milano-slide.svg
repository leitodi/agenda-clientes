  <path d="M106 614 C344 524 594 480 842 480 C1076 480 1298 520 1492 612" fill="none" stroke="url(#gold)" stroke-opacity="0.26" stroke-width="6"/>
  <text x="800" y="230" text-anchor="middle" fill="#eef3fa" font-size="142" font-family="Arial Black, Arial, sans-serif" letter-spacing="6">SALON MILANO</text>
  <text x="800" y="420" text-anchor="middle" fill="#f7edd2" font-size="80" font-family="Georgia, serif">More than a Barbershop</text>
  <text x="800" y="690" text-anchor="middle" fill="url(#gold)" font-size="38" font-family="Arial, sans-serif" letter-spacing="14">RESERVAS ONLINE</text>
