<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">SM</title>
  <desc id="desc">Monograma SM de Salon Milano para favicon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="55%" stop-color="#cdcdcd"/>
      <stop offset="100%" stop-color="#9d9d9d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <g filter="url(#shadow)" font-family="Arial Black, Arial, sans-serif" font-size="34" text-anchor="middle">
    <text x="24" y="42" fill="url(#metal)">S</text>
    <text x="42" y="42" fill="none" stroke="url(#metal)" stroke-width="2.8" paint-order="stroke">M</text>
  </g>
</svg>
